<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans TC', sans-serif; }
    [x-cloak] { display: none !important; }
    
    /* 背景圖修正：使用 Unsplash 的城市圖，並增加亮度過濾器 */
    .custom-bg {
      background-image: url('https://images.unsplash.com/photo-1449156001935-d2863fb72610?auto=format&fit=crop&w=1600&q=80'); 
      background-size: cover;
      background-position: center;
      background-attachment: fixed; /* 讓背景固定 */
      filter: brightness(0.7);
    }

    /* 隱藏原生 Range 樣式 */
    .range-slider input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      background: transparent;
      pointer-events: none;
      position: absolute;
    }

    .range-slider input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 20px;
      width: 20px;
      border-radius: 50%;
      background: #2563eb;
      cursor: pointer;
      pointer-events: auto;
      border: 3px solid white;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }
    
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  </style>
</head>
<body class="relative min-h-screen flex items-center justify-center p-4 bg-slate-900" x-data="rentApp()">

  <div class="fixed inset-0 custom-bg z-0"></div>
  <div class="fixed inset-0 bg-blue-900/20 z-0"></div>

  <div class="relative z-10 w-full max-w-lg bg-white/95 backdrop-blur-md rounded-[2rem] shadow-2xl p-8 border border-white/20 overflow-hidden">
    
    <div class="text-center mb-6">
      <h1 class="text-2xl font-black text-slate-900 tracking-tight">FB 租屋快搜</h1>
      <p class="text-slate-500 text-[10px] font-bold mt-1 uppercase tracking-widest">Rental Automation Pro</p>
    </div>

    <div class="space-y-5">
      <div>
        <label class="text-xs font-black text-slate-400 mb-2 block uppercase">01. 選擇區域</label>
        <div class="flex flex-wrap gap-1.5 mb-2">
          <template x-for="city in Object.keys(districtsData)" :key="city">
            <button @click="currentCity = city; selectedDistricts = []" 
              :class="currentCity === city ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'"
              class="px-3 py-1 rounded-lg text-[11px] font-bold transition-all" x-text="city"></button>
          </template>
        </div>
        <div class="bg-slate-50 p-3 rounded-xl flex flex-wrap gap-1.5 border border-slate-100 max-h-24 overflow-y-auto custom-scrollbar">
          <template x-for="dist in districtsData[currentCity]" :key="dist">
            <button @click="toggleDistrict(dist)"
              :class="selectedDistricts.includes(dist) ? 'bg-blue-600 text-white' : 'bg-white text-slate-400 border-slate-100'"
              class="px-2.5 py-1 rounded-md text-[10px] font-bold border transition-all" x-text="dist"></button>
          </template>
        </div>
      </div>

      <div>
        <label class="text-xs font-black text-slate-400 mb-2 block uppercase">02. 理想房型</label>
        <div class="grid grid-cols-4 gap-2">
          <template x-for="type in roomTypes" :key="type">
            <button @click="toggleRoomType(type)"
              :class="selectedRoomTypes.includes(type) ? 'bg-blue-600 text-white shadow-md' : 'bg-slate-50 text-slate-400'"
              class="py-2 rounded-lg text-[10px] font-black border border-transparent transition-all" x-text="type"></button>
          </template>
        </div>
      </div>

      <div>
        <div class="flex justify-between items-end mb-2">
          <label class="text-xs font-black text-slate-400 uppercase">03. 月租預算</label>
          <span class="text-[11px] font-black text-blue-600 bg-blue-50 px-2 py-0.5 rounded" x-text="`$${minPrice} - $${maxPrice}`"></span>
        </div>
        <div class="relative w-full h-4 flex items-center range-slider px-1">
          <div class="absolute w-full h-1.5 bg-slate-100 rounded-full"></div>
          <div class="absolute h-1.5 bg-blue-500 rounded-full" :style="`left: ${((minPrice - 3000) / 47000) * 100}%; right: ${100 - ((maxPrice - 3000) / 47000) * 100}%` "></div>
          <input type="range" min="3000" max="50000" step="500" x-model.number="minPrice" @input="checkPrice()">
          <input type="range" min="3000" max="50000" step="500" x-model.number="maxPrice" @input="checkPrice()">
        </div>
      </div>

      <div>
        <label class="text-xs font-black text-slate-400 mb-2 block uppercase">04. 其他需求</label>
        <div class="flex flex-wrap gap-2">
          <template x-for="tag in tagsData" :key="tag">
            <button @click="toggleTag(tag)"
              :class="selectedTags.includes(tag) ? 'border-slate-900 bg-slate-900 text-white' : 'border-slate-200 text-slate-400'"
              class="px-3 py-1.5 rounded-full text-[10px] font-bold border transition-all" x-text="tag"></button>
          </template>
        </div>
      </div>

      <div class="pt-4">
        <button @click="showModal = true" :disabled="isSearching || isCooldown"
          class="w-full py-4 bg-slate-900 text-white font-black text-sm rounded-2xl shadow-xl hover:bg-blue-600 transition-all disabled:opacity-30">
          <span x-show="!isSearching && !isCooldown">⚡ 立即登記需求</span>
          <span x-show="isSearching">正在排隊中...</span>
          <span x-show="isCooldown" x-text="`冷卻中 (${cooldownSeconds}s)`"></span>
        </button>
      </div>
    </div>

    <div x-show="searchResult" x-cloak class="mt-4 p-3 bg-blue-50 rounded-xl text-[11px] font-bold text-blue-800 text-center" x-text="searchResult"></div>
  </div>

  <div x-show="showModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
    <div class="bg-white rounded-[1.5rem] p-6 max-w-xs w-full shadow-2xl">
      <h3 class="text-lg font-black text-slate-900 mb-1">最後一步</h3>
      <p class="text-slate-400 text-[10px] mb-4">結果將寄送至您的 Email</p>
      <input type="email" x-model="userEmail" placeholder="your@email.com" class="w-full px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl mb-4 text-sm font-bold focus:ring-2 focus:ring-blue-500 outline-none text-center">
      <div class="flex gap-2">
          <button @click="showModal = false" class="flex-1 py-3 text-xs font-bold text-slate-400">取消</button>
          <button @click="executeSearch()" class="flex-[2] py-3 bg-blue-600 text-white text-xs font-black rounded-xl">確認送出</button>
      </div>
    </div>
  </div>

  <script>
    function rentApp() {
      return {
        isSearching: false, isCooldown: false, cooldownSeconds: 0, showModal: false, 
        userEmail: '', searchResult: '', minPrice: 8000, maxPrice: 20000, 
        currentCity: '台北市', selectedDistricts: [], selectedTags: [],
        roomTypes: ['雅房', '套房', '分租', '整層'], selectedRoomTypes: [],
        districtsData: {
          '台北市': ['中正', '大同', '中山', '松山', '大安', '萬華', '信義', '士林', '北投', '內湖', '南港', '文山'],
          '新北市': ['板橋', '三重', '中和', '永和', '新莊', '新店', '土城', '蘆洲', '汐止', '樹林', '淡水', '林口'],
          '桃園市': ['桃園區', '中壢', '八德', '平鎮', '龜山', '蘆竹']
        },
        tagsData: ['🐾 寵物', '⚡ 台水電', '🛗 電梯', '☀️ 陽台', '🚅 近捷運', '🍳 開伙'],

        init() {
          const lastSubmit = localStorage.getItem('lastRentSubmit');
          if (lastSubmit) {
            const diff = Math.floor((Date.now() - parseInt(lastSubmit)) / 1000);
            if (diff < 300) this.startCooldown(300 - diff);
          }
        },
        checkPrice() { if (this.minPrice > this.maxPrice) this.minPrice = this.maxPrice; },
        toggleDistrict(dist) { this.selectedDistricts.includes(dist) ? this.selectedDistricts = this.selectedDistricts.filter(d => d !== dist) : this.selectedDistricts.push(dist); },
        toggleRoomType(type) { this.selectedRoomTypes.includes(type) ? this.selectedRoomTypes = this.selectedRoomTypes.filter(t => t !== type) : this.selectedRoomTypes.push(type); },
        toggleTag(tag) { this.selectedTags.includes(tag) ? this.selectedTags = this.selectedTags.filter(t => t !== tag) : this.selectedTags.push(tag); },
        startCooldown(seconds) {
          this.isCooldown = true; this.cooldownSeconds = seconds;
          const timer = setInterval(() => { this.cooldownSeconds--; if (this.cooldownSeconds <= 0) { this.isCooldown = false; clearInterval(timer); } }, 1000);
        },
        async executeSearch() {
          if(!this.userEmail.includes('@')) { alert('Email 格式錯誤'); return; }
          this.showModal = false; this.isSearching = true;
          try {
            const response = await fetch('http://localhost:5678/webhook/rent-request', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                email: this.userEmail, city: this.currentCity, districts: this.selectedDistricts.join(','),
                roomTypes: this.selectedRoomTypes.join(','), minPrice: this.minPrice, maxPrice: this.maxPrice, tags: this.selectedTags.join(',')
              })
            });
            if (response.ok) {
              this.searchResult = '✅ 登記成功！符合條件時會立刻通知您。';
              localStorage.setItem('lastRentSubmit', Date.now().toString());
              this.startCooldown(300);
            }
          } catch (e) { this.searchResult = '⚠️ 連線失敗，請檢查網路。'; }
          finally { this.isSearching = false; }
        }
      }
    }
  </script>
</body>
</html>
