<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans TC', sans-serif; margin: 0; padding: 0; }
    [x-cloak] { display: none !important; }
    .custom-bg {
      background-image: url('https://images.unsplash.com/photo-1560518883-ce09059eeffa?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80'); 
      background-size: cover; background-position: center; background-attachment: fixed; background-repeat: no-repeat;
      filter: brightness(0.6) blur(2px); background-color: #1e3a8a;
    }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .range-slider input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; background: transparent; pointer-events: none; position: absolute; }
    .range-slider input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%; background: #2563eb; cursor: pointer; pointer-events: auto; border: 2px solid white; box-shadow: 0 4px 6px rgb(0 0 0 / 0.2); }
    .animate-pop { animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes popIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body class="relative min-h-screen flex items-center justify-center p-4" x-data="rentApp()">

  <div class="fixed inset-0 custom-bg z-0"></div>
  <div class="fixed inset-0 bg-gradient-to-b from-blue-900/40 to-slate-900/60 z-0"></div>

  <div x-show="!showModal" class="relative z-10 w-full max-w-md bg-white/95 backdrop-blur-md rounded-[2.5rem] shadow-2xl p-8 border border-white/20">
    <div class="text-center mb-6">
      <h1 class="text-3xl font-black text-slate-900 tracking-tight">租屋小管家 AI</h1>
      <p class="text-slate-500 text-xs font-bold mt-1 uppercase tracking-widest">AI Rental Monitor</p>
    </div>

    <div class="space-y-6">
      <div>
        <label class="text-sm font-black text-slate-500 mb-3 block uppercase tracking-wider">01. 選擇區域</label>
        <div class="flex flex-wrap gap-2 mb-3">
          <template x-for="city in Object.keys(districtsData)" :key="city">
            <button @click="currentCity = city; selectedDistricts = []" 
              :class="currentCity === city ? 'bg-blue-600 text-white shadow-lg' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'"
              class="px-4 py-2 rounded-xl text-sm font-bold transition-all" x-text="city"></button>
          </template>
        </div>
        <div class="bg-slate-50/80 p-4 rounded-2xl flex flex-wrap gap-2 border border-slate-100 max-h-48 overflow-y-auto shadow-inner text-sm">
          <template x-for="dist in districtsData[currentCity]" :key="dist">
            <button @click="toggleDistrict(dist)"
              :class="selectedDistricts.includes(dist) ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-600 border-slate-200'"
              class="px-3 py-1.5 rounded-lg font-medium border transition-all" x-text="dist"></button>
          </template>
        </div>
      </div>

      <div>
        <div class="flex justify-between items-center mb-3">
          <label class="text-sm font-black text-slate-500 uppercase tracking-wider">02. 月租上限</label>
          <div class="flex items-center space-x-2 bg-blue-50 px-3 py-1.5 rounded-xl border border-blue-100">
            <span class="text-xs font-bold text-blue-600">NT$</span>
            <input type="number" x-model.number="maxPrice" class="w-20 bg-transparent text-sm font-black text-blue-600 text-center outline-none">
          </div>
        </div>
        <div class="relative w-full h-6 flex items-center range-slider px-1">
          <div class="absolute w-full h-2 bg-slate-200 rounded-full"></div>
          <div class="absolute h-2 bg-blue-500 rounded-full" :style="`width: ${((maxPrice - 3000) / 47000) * 100}%` "></div>
          <input type="range" min="3000" max="50000" step="500" x-model.number="maxPrice" class="w-full">
        </div>
      </div>

      <div class="pt-4">
        <button @click="openModal()" class="w-full py-5 bg-slate-900 text-white font-black text-base rounded-2xl shadow-2xl hover:bg-blue-600 active:scale-95 transition-all">
          🚀 立即搜尋房源
        </button>
      </div>
    </div>
  </div>

  <div x-show="showModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-md">
    <div class="bg-slate-50 rounded-[2.5rem] p-8 max-w-md w-full shadow-2xl relative animate-pop">
      
      <div x-show="!referralCodeGenerated">
        <div class="text-center mb-6">
          <h3 class="text-2xl font-black text-slate-900">最後一步</h3>
          <p class="text-slate-500 text-sm mt-1">輸入 Email 即可獲取您的專屬邀請碼</p>
        </div>

        <div class="space-y-4 mb-6">
          <input type="email" x-model="userEmail" placeholder="您的常用 Email" 
            class="w-full px-5 py-4 bg-white border border-slate-200 rounded-2xl text-center font-bold focus:ring-2 focus:ring-blue-500 outline-none">
          
          <input type="text" x-model="referralCode" placeholder="若有朋友推薦，請輸入代碼 (選填)" 
            class="w-full px-5 py-3 bg-white border border-slate-100 rounded-xl text-center text-sm font-medium outline-none">
        </div>

        <div class="grid grid-cols-1 gap-3">
          <button @click="submitAndGetCode('telegram')" :disabled="loading"
            class="bg-blue-600 p-4 rounded-2xl text-white hover:bg-blue-700 transition-all flex items-center justify-center space-x-2">
            <span x-show="!loading" class="font-black">✈️ 使用 Telegram 接收通知</span>
            <span x-show="loading" class="animate-pulse">處理中...</span>
          </button>
          <button @click="submitAndGetCode('email')" :disabled="loading"
            class="bg-white border-2 border-slate-200 p-4 rounded-2xl text-slate-800 hover:border-blue-400 transition-all font-black">
            📧 使用 Email 接收通知
          </button>
        </div>
        <button @click="showModal = false" class="w-full mt-6 text-slate-400 text-xs font-bold underline">返回修改條件</button>
      </div>

      <div x-show="referralCodeGenerated" class="text-center py-2">
        <div class="w-16 h-16 bg-blue-600 text-white rounded-full flex items-center justify-center text-2xl mx-auto mb-4 shadow-lg">🎁</div>
        <h3 class="text-2xl font-black text-slate-900 text-center">好友分享禮</h3>
        <p class="text-slate-600 text-sm mt-3 leading-relaxed">
          邀請好友使用您的代碼，<br>
          <span class="text-blue-600 font-black px-1">雙方皆可獲得 5 次</span> 免費搜尋額度！
        </p>
        
        <div class="mt-6 p-6 bg-white rounded-3xl border-2 border-dashed border-blue-200 cursor-pointer hover:bg-blue-50 transition-colors" @click="copyCode()">
          <span class="text-4xl font-black text-blue-600 tracking-widest" x-text="generatedCode"></span>
          <div class="text-[10px] text-blue-400 mt-2 font-bold uppercase">點擊即可複製代碼</div>
        </div>

        <div class="mt-8 space-y-3">
          <button @click="shareToLine()" class="w-full py-4 bg-[#06C755] text-white font-black rounded-2xl shadow-xl flex items-center justify-center">
            <span>LINE 分享給好友</span>
          </button>
          <button @click="proceedToFinal()" class="w-full py-4 bg-slate-900 text-white font-black rounded-2xl shadow-xl">
            下一步：前往綁定機器人
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    function rentApp() {
      return {
        showModal: false,
        loading: false,
        referralCodeGenerated: false,
        generatedCode: '',
        userEmail: '',
        referralCode: '',
        maxPrice: 20000,
        currentCity: '桃園市',
        selectedDistricts: [],
        notifyType: '',
        districtsData: {
          '桃園市': ['桃園區', '中壢區', '八德區', '平鎮區', '大溪區', '楊梅區', '龜山區', '蘆竹區', '大園區', '觀音區', '新屋區', '龍潭區'],
          '台北市': ['中正區', '大同區', '中山區', '松山區', '大安區', '萬華區', '信義區', '士林區', '北投區', '內湖區', '南港區', '文山區'],
          '新北市': ['板橋區', '三重區', '中和區', '永和區', '新莊區', '新店區', '土城區', '蘆洲區', '汐止區', '樹林區', '淡水區', '林口區', '五股區']
        },

        openModal() {
          if(this.selectedDistricts.length === 0) {
            alert('請至少選擇一個行政區');
            return;
          }
          this.showModal = true;
        },

        toggleDistrict(dist) {
          if (this.selectedDistricts.includes(dist)) {
            this.selectedDistricts = this.selectedDistricts.filter(d => d !== dist);
          } else {
            this.selectedDistricts.push(dist);
          }
        },

        async submitAndGetCode(type) {
          if(!this.userEmail.includes('@')) { alert('請填寫正確的 Email'); return; }
          this.loading = true;
          this.notifyType = type;

          try {
            const response = await fetch('https://caressive-thrasonically-tomi.ngrok-free.dev/webhook/save-rental-data', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                email: this.userEmail,
                districts: this.selectedDistricts.join(','),
                maxPrice: this.maxPrice,
                input_referral_code: this.referralCode,
                notify_method: type
              })
            });

            if (response.ok) {
              const result = await response.json();
              // 如果 n8n 沒回傳 code，給一個預設值測試
              this.generatedCode = result.referral_code || 'RENT' + Math.floor(Math.random()*900 + 100);
              this.referralCodeGenerated = true;
            } else {
              alert('伺服器回應錯誤，請檢查 n8n 設定');
            }
          } catch (e) {
            alert('無法連線到伺服器 (請確認 Webhook 網址正確且已開啟)');
          } finally {
            this.loading = false;
          }
        },

        copyCode() {
          navigator.clipboard.writeText(this.generatedCode);
          alert('邀請碼 ' + this.generatedCode + ' 已複製！');
        },

        shareToLine() {
          const msg = `我正在用這個 AI 租屋管家，超好用！\n使用我的邀請碼「${this.generatedCode}」我們都可以多拿 5 次免費搜尋！\n點此開始：${window.location.href}`;
          window.open(`https://social-plugins.line.me/lineit/share?text=${encodeURIComponent(msg)}`, '_blank');
        },

        proceedToFinal() {
          if (this.notifyType === 'telegram') {
            const encodedEmail = btoa(this.userEmail).replace(/=/g, "");
            window.location.href = `./go-tg.html?email=${encodedEmail}`;
          } else {
            alert('監控已啟動！符合條件的房源將發送至：' + this.userEmail);
            location.reload();
          }
        }
      }
    }
  </script>
</body>
</html>
